<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zeppelin · Equipo</title>
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zeppelin Equipo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0A;--card:#151515;--card2:#1c1c1c;--line:#2a2a2a;--txt:#f4f4f4;--muted:#8c8c8c;--zepp:#FF5A00;--bad:#ff453a;--ok:#30d158}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 Oswald,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 28px)}
header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{font:400 clamp(26px,8vw,34px)/1 'Bebas Neue',sans-serif;letter-spacing:1px;white-space:nowrap}
.logo span{color:var(--zepp)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);text-align:right}
.who{min-width:0}
#quien{min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
.btn-out{flex:none}
.btn-out{background:none;border:1px solid #3a3a3a;color:var(--txt);border-radius:999px;padding:5px 12px;font:500 12px Oswald,sans-serif;letter-spacing:.5px;cursor:pointer}
.hola{font:500 20px Oswald,sans-serif;margin:14px 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
h2{font:400 22px/1 'Bebas Neue',sans-serif;letter-spacing:1px;color:var(--muted);margin:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px;min-height:128px;transition:transform .08s,border-color .15s;cursor:pointer;text-align:left}
.tile.on{border-color:#3a2a20}
.tile.on:active{transform:scale(.98)}
.tile.on:hover{border-color:var(--zepp)}
.tile .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:rgba(255,90,0,.14);color:var(--zepp)}
.tile .ico svg{width:22px;height:22px}
.tile .nm{font:400 26px/1 'Bebas Neue',sans-serif;letter-spacing:1px}
.tile .ds{font-size:12px;color:var(--muted);line-height:1.3}
.tag{position:absolute;top:12px;right:12px;font:600 10px Oswald,sans-serif;letter-spacing:.8px;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:#222;color:#bbb}
.tag.o{background:rgba(255,90,0,.15);color:var(--zepp)}
.tag.g{background:rgba(48,209,88,.13);color:var(--ok)}
.tag.r{background:rgba(255,69,58,.15);color:var(--bad)}
.tile.off{opacity:.42;cursor:not-allowed}
.tile.off .ico{background:#222;color:#777}
.foot{margin-top:26px;font-size:12px;color:var(--muted);text-align:center}
/* vistas internas */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{background:var(--card);border:1px solid var(--line);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;flex:none}
.top h1{font:400 30px/1 'Bebas Neue',sans-serif;letter-spacing:1px;margin:0}
.top small{display:block;font:400 12px Oswald,sans-serif;color:var(--muted);letter-spacing:.3px;margin-top:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:500 13px Oswald,sans-serif;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--zepp);border-color:var(--zepp);color:#0A0A0A}
.chip.mine{border-color:#5a3a20}
.lbl{font:600 11px Oswald,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.meta span{font-size:12px;color:#cfcfcf;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:3px 9px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.acc>button{width:100%;background:none;border:none;text-align:left;padding:14px;display:flex;align-items:center;gap:10px;cursor:pointer;font:500 16px Oswald,sans-serif}
.acc>button .n{color:var(--zepp);font:400 18px 'Bebas Neue',sans-serif;width:22px}
.acc>button .ch{margin-left:auto;color:var(--muted);transition:transform .2s}
.acc.open>button .ch{transform:rotate(180deg)}
.acc .bd{display:none;padding:0 14px 14px;font:400 14px/1.55 Inter,system-ui,sans-serif;color:#dcdcdc}
.acc.open .bd{display:block}
.bd p{margin:0 0 8px}
ul.it{margin:0;padding:0;list-style:none}
ul.it li{position:relative;padding:7px 0 7px 22px;border-top:1px solid #1f1f1f}
ul.it li:first-child{border-top:none}
ul.it li:before{content:'';position:absolute;left:4px;top:15px;width:7px;height:7px;border-radius:2px;background:var(--zepp)}
.nota{margin-top:10px;background:rgba(255,90,0,.07);border-left:3px solid var(--zepp);border-radius:6px;padding:9px 11px;font-size:13px;color:#e8e8e8}
.pend{background:var(--card);border:1px dashed #3a3a3a;border-radius:12px;padding:18px;color:var(--muted);font:400 14px Inter,sans-serif}
/* protocolos */
.plist{display:grid;gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;display:flex;align-items:center;gap:12px}
.pcard:hover{border-color:var(--zepp)}
.pcard .nm{font:400 28px/1 'Bebas Neue',sans-serif;letter-spacing:1px}
.pcard .ds{font-size:12px;color:var(--muted)}
.pcard .go{margin-left:auto;color:var(--zepp)}
.steps{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.steps::-webkit-scrollbar{display:none}
.step{flex:0 0 100%;scroll-snap-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;min-height:60vh;font:400 14px/1.55 Inter,system-ui,sans-serif;color:#dcdcdc}
.step .num{font:600 11px Oswald,sans-serif;letter-spacing:1.2px;color:var(--zepp);text-transform:uppercase}
.step h3{font:400 32px/1 'Bebas Neue',sans-serif;letter-spacing:1px;color:var(--txt);margin:6px 0 4px}
.step .sb{font:400 13px Oswald,sans-serif;color:var(--muted);margin-bottom:10px}
.kv{display:flex;flex-direction:column;gap:6px;margin:10px 0 12px}
.kv div{font-size:12.5px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.kv b{font:600 10.5px Oswald,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--muted);display:block}
.sp{margin:10px 0;border:1px solid #3a2a20;background:#1a130e;border-radius:12px;padding:11px 13px}
.sp .k{font:600 10.5px Oswald,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--zepp);margin-bottom:4px}
.sp q{display:block;font:400 16px/1.45 Oswald,sans-serif;color:var(--txt);quotes:"“" "”"}
.no{margin-top:12px;border:1px solid #4a2020;background:#1a0f0f;border-radius:12px;padding:10px 13px}
.no .k{font:600 10.5px Oswald,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--bad);margin-bottom:4px}
.no li:before{background:var(--bad)!important}
.regla{margin-top:12px;border:1px solid #4a3a10;background:#17140b;border-radius:12px;padding:11px 13px;font:500 15px Oswald,sans-serif;color:#ffd36b}
.nav{display:flex;align-items:center;gap:10px;margin-top:12px}
.nav button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 16px;cursor:pointer;font:500 14px Oswald,sans-serif;letter-spacing:.5px}
.nav button.pri{background:var(--zepp);border-color:var(--zepp);color:#0A0A0A;margin-left:auto}
.nav button:disabled{opacity:.35}
.dots{display:flex;gap:5px;flex:1;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:#333}
.dots i.on{background:var(--zepp);width:18px;border-radius:4px}
/* reglamento */
.rg{font:400 14.5px/1.6 Inter,system-ui,sans-serif;color:#dcdcdc}
.rg h3{font:400 24px/1.1 'Bebas Neue',sans-serif;letter-spacing:1px;color:var(--txt);margin:22px 0 8px}
.rg h3 span{color:var(--zepp);margin-right:6px}
.rg p{margin:0 0 8px}
.rtab{width:100%;border-collapse:collapse;font-size:13.5px}
.rtab td{border-top:1px solid var(--line);padding:9px 6px;vertical-align:top}
.rtab td:first-child{font:500 14px Oswald,sans-serif;color:var(--txt);width:38%}
.acept{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.acept .big{background:var(--zepp);color:#0A0A0A;border:none;border-radius:10px;padding:14px 18px;font:600 16px Oswald,sans-serif;letter-spacing:1px;cursor:pointer;width:100%}
.acept .big:disabled{opacity:.35;cursor:not-allowed}
.acept .ok{color:var(--ok);font:500 16px Oswald,sans-serif}
.acept small{display:block;color:var(--muted);font:400 12px Inter,sans-serif;margin-top:8px}
.banner{background:rgba(255,90,0,.08);border:1px solid #5a3a20;border-radius:12px;padding:12px 14px;margin:0 0 14px;font:400 13.5px Inter,sans-serif;display:flex;gap:10px;align-items:center;cursor:pointer}
.banner b{font-family:Oswald,sans-serif;font-weight:500}
.banner>svg{width:22px;height:22px;flex:none;color:var(--zepp)}
.adm{margin-top:26px}
.adm table{width:100%;border-collapse:collapse;font:400 13px Inter,sans-serif}
.adm td{border-top:1px solid var(--line);padding:8px 4px}
.adm td:last-child{text-align:right;white-space:nowrap}
/* login */
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px}
#login form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px 20px;display:flex;flex-direction:column;gap:10px}
#login label{font-size:12px;color:var(--muted)}
#login input{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:17px;padding:11px;font-family:Oswald,sans-serif}
#login button{background:var(--zepp);color:#0A0A0A;border:none;border-radius:8px;padding:12px;font:600 15px Oswald,sans-serif;letter-spacing:1px;cursor:pointer}
#lErr{min-height:18px;color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);background:#222;border:1px solid #333;border-radius:999px;padding:9px 16px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1}
/* ausencias */
.mut{color:var(--muted);font:400 12.5px Inter,sans-serif}
.opts{display:grid;gap:10px;margin-bottom:6px}
.opt{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer}
.opt:hover{border-color:var(--zepp)}
.opt b{display:block;font:400 26px/1 'Bebas Neue',sans-serif;letter-spacing:1px;font-weight:400}
.opt small{display:block;color:var(--muted);font:400 13px/1.4 Inter,sans-serif;margin-top:6px}
.cont{display:flex;align-items:baseline;gap:8px;margin:14px 0 0;font:400 13px Inter,sans-serif;color:var(--muted)}
.cont b{font:400 24px/1 'Bebas Neue',sans-serif;color:var(--txt);letter-spacing:1px;font-weight:400}
.frm{display:flex;flex-direction:column}
.frm>label,.frm .fl{font:600 11px Oswald,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.frm input[type=date],.frm input[type=time],.frm input[type=text],.frm textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--txt);font:400 16px Inter,sans-serif;padding:11px 12px;width:100%;color-scheme:dark}
.frm textarea{min-height:88px;resize:vertical}
.frm input:focus,.frm textarea:focus{outline:none;border-color:var(--zepp)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;text-align:left;cursor:pointer}
.seg button.on{border-color:var(--zepp);background:rgba(255,90,0,.1)}
.seg button b{display:block;font:400 21px/1 'Bebas Neue',sans-serif;letter-spacing:1px;font-weight:400}
.seg button small{display:block;color:var(--muted);font:400 12px Inter,sans-serif;margin-top:3px}
.frm label.chk{display:flex;gap:10px;align-items:center;text-transform:none;letter-spacing:0;font:400 14px Inter,sans-serif;color:var(--txt);margin:14px 0 4px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--zepp)}
.frm>label.file{text-transform:none;letter-spacing:0;margin:0;display:flex;align-items:center;gap:10px;background:var(--card);border:1px dashed #3a3a3a;border-radius:10px;padding:12px;cursor:pointer;font:400 14px Inter,sans-serif;color:#dcdcdc}
.file input{display:none}
[hidden]{display:none!important}
.msg{font:400 13.5px/1.45 Inter,sans-serif;margin-top:14px;padding:10px 12px;border-radius:10px}
.msg:empty{display:none}
.msg.err{background:#1a0f0f;border:1px solid #4a2020;color:#ffc2bd}
.msg.ok{background:rgba(48,209,88,.07);border:1px solid #1f4a2a;color:#b9f0c8}
.btnz{background:var(--zepp);color:#0A0A0A;border:none;border-radius:10px;padding:14px 18px;font:600 16px Oswald,sans-serif;letter-spacing:1px;cursor:pointer;width:100%;margin-top:18px}
.btnz:disabled{opacity:.35;cursor:not-allowed}
.sol{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.sol .h{display:flex;gap:8px;align-items:center}
.sol .t{font:500 16px Oswald,sans-serif}
.sol .tag{position:static;margin-left:auto;flex:none}
.sol .f{font:400 13px Inter,sans-serif;color:var(--zepp);margin-top:2px}
.sol .d{font:400 13px/1.45 Inter,sans-serif;color:#cfcfcf;margin-top:6px;white-space:pre-wrap}
.sol .c{font:400 12.5px Inter,sans-serif;color:var(--muted);margin-top:6px}
.sol .c a{color:var(--zepp);text-decoration:underline}
.sol .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sol .acts button,.sol .acts label{flex:1;min-width:120px;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:500 13.5px Oswald,sans-serif;letter-spacing:.4px;cursor:pointer;text-align:center}
.sol .acts .si{background:var(--zepp);border-color:var(--zepp);color:#0A0A0A}
.sol .acts .no2{border-color:#4a2020;color:#ffb4ae}
.sol .acts input{display:none}
.dia{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.dia .dh{display:flex;font:500 15px Oswald,sans-serif;text-transform:capitalize}
.dia .dh span{margin-left:auto;color:var(--muted);font:400 12.5px Inter,sans-serif;text-transform:none}
.dia .dh span.full{color:var(--bad)}
.dia .dl{font:400 13.5px Inter,sans-serif;color:#dcdcdc;padding:5px 0;border-top:1px solid #1f1f1f}
.dia .dl:first-of-type{border-top:none}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.row button{flex:none;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:0 16px;cursor:pointer;font:500 14px Oswald,sans-serif}
.xbtn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:0 4px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="login">
  <form id="lForm" autocomplete="on">
    <div class="logo"><span>ZEPPELIN</span> EQUIPO</div>
    <label for="lDni">DNI</label><input id="lDni" inputmode="numeric" autocomplete="username" placeholder="Sin puntos">
    <label for="lPass">Clave</label><input id="lPass" type="password" autocomplete="current-password">
    <div id="lErr"></div>
    <button id="lBtn" type="submit">INGRESAR</button>
    <div style="font-size:11px;color:var(--muted)">La clave te la da Fernando.</div>
  </form>
</div>

<div class="wrap" id="app" style="display:none">
  <header>
    <div class="logo"><span>ZEPPELIN</span> EQUIPO</div>
    <div class="who"><span id="quien"></span><button class="btn-out" id="salir">Salir</button></div>
  </header>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script src="contenido.js"></script>
<script>
const ACCESOS_URL='https://script.google.com/macros/s/AKfycbyRC8Y2pb1eU7g8nvEmMrTIVS5V23YVa3Hcj6z77jS3UkWVWxiRInAhFJuaD3tnDGv8/exec';
const API_URL='https://script.google.com/macros/s/AKfycbww3YDOpbsU-YjTmxzGwZZFswKt7Odavmx4O0kP8cOBrAbYHShu8jSGsG8bhqemY89c/exec'; // backend de la Maestra (proveedores + reglamento)
const LS_SES='zpp_sesion';
const C=window.ZEP_CONTENIDO;

const I={
  caja:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>',
  stock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>',
  fichas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>',
  reservas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  checklist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 7 2 2 4-4M4 16l2 2 4-4M13 7h7M13 16h7"/></svg>',
  manual:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 7h6"/></svg>',
  proto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>',
  regla:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>',
  ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>',
  aus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15.5h6"/></svg>',
  back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  chev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  go:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>'

function vProtocolo(id, paso){
  const p=C.PROTOCOLOS.find(x=>x.id===id); if(!p){ location.hash='protocolos'; return; }
  const N=p.pasos.length;
  const card=(s,i)=>`<section class="step" data-i="${i}">
      <div class="num">Paso ${i+1} de ${N}</div>
      <h3>${esc(s.t)}</h3>${s.sub?`<div class="sb">${esc(s.sub)}</div>`:''}
      ${(s.quien||s.cuando)?`<div class="kv">${s.quien?`<div><b>Responsable</b>${esc(s.quien)}</div>`:''}${s.cuando?`<div><b>Cuándo</b>${esc(s.cuando)}</div>`:''}</div>`:''}
      ${s.p?`<p>${esc(s.p)}</p>`:''}
      ${bloqueItems(s.items)}
      ${(s.speech||[]).map(([k,q])=>`<div class="sp"><div class="k">${esc(k)}</div><q>${esc(q)}</q></div>`).join('')}
      ${s.no?`<div class="no"><div class="k">Lo que no se hace</div>${bloqueItems(s.no)}</div>`:''}
      ${s.regla?`<div class="regla">Regla de oro: ${esc(s.regla)}</div>`:''}
      ${s.nota?`<div class="nota">${esc(s.nota)}</div>`:''}
    </section>`;
  $('#view').innerHTML = cabecera(p.titulo, p.sub, 'protocolos') + `
    <div class="steps" id="steps">${p.pasos.map(card).join('')}</div>
    <div class="nav"><button id="prev" type="button">Anterior</button><div class="dots" id="dots">${p.pasos.map(()=>'<i></i>').join('')}</div><button id="next" class="pri" type="button">Siguiente</button></div>`;
  const box=$('#steps'), dots=[...document.querySelectorAll('#dots i')];
  let cur=0;
  const go=i=>{ i=Math.max(0,Math.min(N-1,i)); const w=box.children[0].getBoundingClientRect().width+12; box.scrollTo({left:i*w, behavior:'smooth'}); };
  const sync=()=>{ const w=box.children[0].getBoundingClientRect().width+12; cur=Math.round(box.scrollLeft/w); dots.forEach((d,k)=>d.classList.toggle('on',k===cur)); $('#prev').disabled=cur===0; $('#next').textContent= cur===N-1?'Terminar':'Siguiente'; };
  box.addEventListener('scroll',()=>{ clearTimeout(box._t); box._t=setTimeout(sync,60); });
  $('#prev').onclick=()=>go(cur-1);
  $('#next').onclick=()=>{ if(cur===N-1){ location.hash='protocolos'; return; } go(cur+1); };
  sync(); if(paso) setTimeout(()=>go(+paso),50);
}

let leidoHastaElFinal=false;
function pintarAceptacion(){
  const box=$('#acept'); if(!box) return;
  if(REG.estado==='aceptado'){ box.innerHTML=`<div class="ok">✓ Aceptaste este reglamento el ${fechaAR(REG.fecha)}</div><small>Si cambia, te vamos a pedir que lo vuelvas a aceptar.</small>`; return; }
  if(REG.estado==='cargando'){ box.innerHTML=`<small>Consultando…</small>`; return; }
  box.innerHTML=`<button class="big" id="btnAcept" ${leidoHastaElFinal?'':'disabled'}>LEÍ Y ACEPTO</button>
    <small id="hintAcept">${leidoHastaElFinal?'Queda registrado con tu nombre, DNI y la fecha de hoy.':'Leé hasta el final para poder aceptar.'}</small>
    ${REG.estado==='error'?'<small style="color:var(--bad)">No se pudo consultar tu estado. Revisá la conexión.</small>':''}`;
  const fin=$('#fin');
  if(!leidoHastaElFinal && 'IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)){ leidoHastaElFinal=true; io.disconnect(); const b=$('#btnAcept'); if(b){ b.disabled=false; $('#hintAcept').textContent='Queda registrado con tu nombre, DNI y la fecha de hoy.'; } } });
    io.observe(fin);
  } else if(!('IntersectionObserver' in window)){ leidoHastaElFinal=true; }
  $('#btnAcept').onclick=async ()=>{
    const b=$('#btnAcept'); b.disabled=true; b.textContent='REGISTRANDO…';
    try{
      const j=await post(API_URL,{token:SES.token, action:'reg_aceptar', version:C.REGLAMENTO.version});
      if(j&&j.ok&&j.aceptado){ REG={estado:'aceptado', fecha:j.fecha}; regCacheSet(j.fecha); pintarAceptacion(); toast('Listo, quedó registrado. ¡Gracias!'); if(esAdmin()) cargarAdmin(); }
      else throw new Error((j&&j.error)||'error');
    }catch(e){ b.disabled=false; b.textContent='LEÍ Y ACEPTO'; toast(e.message==='sesion'?'Tu sesión venció. Volvé a ingresar.':'No se pudo registrar. Probá de nuevo.'); if(e.message==='sesion') salir(); }
  };
}

  tarde:{nm:'Llego tarde', ds:'Entrás más tarde', hora:'¿A qué hora llegás?'},

const dowISO=iso=>new Date(iso+'T12:00:00Z').getUTCDay();

async function leerArchivo(f){
  if(!f) return null;
  if(f.type==='application/pdf'){
    if(f.size>8e6) throw new Error('El PDF pesa más de 8 MB.');
    const b64=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=()=>rej(new Error('No se pudo leer el archivo.')); r.readAsDataURL(f); });
    return {nombre:f.name, mime:f.type, b64};
  }
  if(!/^image\//.test(f.type)) throw new Error('Subí una foto o un PDF.');
  const url=URL.createObjectURL(f);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('No se pudo abrir la foto.')); i.src=url; });
    const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return {nombre:(f.name||'foto').replace(/\.[^.]+$/,'')+'.jpg', mime:'image/jpeg', b64:c.toDataURL('image/jpeg',.82).split(',')[1]};
  } finally { URL.revokeObjectURL(url); }
}

function solItem(s, admin){
  const [en,cls]=AUS_ESTADO[s.estado]||[s.estado,''];
  const rango = s.hasta && s.hasta!==s.fecha ? fechaLarga(s.fecha)+' y '+fechaLarga(s.hasta) : fechaLarga(s.fecha);
  const det = s.tipo==='examen' ? [s.institucion, s.materia].filter(Boolean).join(', ') + (s.dias>1?' (2 días)':'')
            : s.tipo==='aviso' ? s.detalle : s.motivo;
  const hoy=hoyISO(), acts=[], info=[];
  if(admin){
    if(s.estado==='pendiente'){ acts.push(`<button class="si" data-act="aprobar" data-id="${esc(s.id)}">Aprobar</button>`, `<button class="no2" data-act="rechazar" data-id="${esc(s.id)}">Rechazar</button>`); }
    if(s.adjunto) info.push(`<a href="${esc(s.adjunto)}" target="_blank" rel="noopener">Ver certificado</a>`);
    if(s.constancia) info.push(`<a href="${esc(s.constancia)}" target="_blank" rel="noopener">Ver constancia</a>`);
  } else {
    if(s.estado==='pendiente') acts.push(`<button data-act="cancelar" data-id="${esc(s.id)}">Cancelar pedido</button>`);
    if(s.tipo==='examen' && (s.estado==='aprobada'||s.estado==='pendiente')){
      if(s.constancia) info.push('Constancia de examen cargada ✓');
      else if((s.hasta||s.fecha)<=hoy) acts.push(`<label>Subir constancia de examen<input type="file" accept="image/*,application/pdf" data-subir="constancia" data-id="${esc(s.id)}"></label>`);
      else info.push('Después de rendir, subí acá la constancia.');
    }
    if(s.tipo==='aviso'){
      if(s.adjunto) info.push('Comprobante cargado ✓');
      else acts.push(`<label>${s.motivo==='enfermedad'?'Subir certificado médico':'Adjuntar comprobante'}<input type="file" accept="image/*,application/pdf" data-subir="adjunto" data-id="${esc(s.id)}"></label>`);
    }
  }
  if(s.comentario) info.push('Fernando: '+esc(s.comentario));
  return `<div class="sol"><div class="h"><span class="t">${admin?esc(s.nombre)+': ':''}${esc(etiquetaTipo(s))}</span><span class="tag ${cls}">${esc(en)}</span></div>
    <div class="f">${esc(rango)}</div>${det?`<div class="d">${esc(det)}</div>`:''}
    ${info.length?`<div class="c">${info.join('<br>')}</div>`:''}${acts.length?`<div class="acts">${acts.join('')}</div>`:''}</div>`;
}

}

/* --- pedido anticipado --- */
function ausCheck(F){
  if(!F.fecha) return {ok:false, msg:''};
  if(F.fecha<hoyISO()) return {ok:false, msg:'Esa fecha ya pasó.', err:1};
  const primer = F.tipo==='examen' && F.diaAnterior ? sumDias(F.fecha,-1) : F.fecha;
  const dow=dowISO(primer);
  const min = F.tipo==='examen' ? AUS_CFG.ANT_EXAMEN : (AUS_CFG.ANT[dow]||AUS_CFG.ANT_DEF);
  const h=horasHasta(primer);
  if(h<min) return {ok:false, err:1, msg:`Para el ${DIAS[dow]} ${primer.slice(8,10)}/${primer.slice(5,7)} se pide con ${min} h de anticipación y faltan ${Math.max(0,Math.floor(h))} h. Si es un imprevisto, usá «Avisar una falta».`};
  if(F.tipo==='examen'){
    const usados=(AUSR&&AUSR.examenUsados)||0, d=F.diaAnterior?2:1;
    if(usados+d>AUS_CFG.TOPE_EXAMEN) return {ok:false, err:1, msg:`Ya usaste ${usados} de ${AUS_CFG.TOPE_EXAMEN} días por examen este año.`};
    if(!F.institucion.trim()||!F.materia.trim()) return {ok:false, msg:''};
  } else {
    if(AUS_TIPOS[F.tipo].hora && !F.hora) return {ok:false, msg:''};
    if(F.motivo.trim().length<5) return {ok:false, msg:''};
  }
  return {ok:true, msg:`Faltan ${Math.floor(h)} h: alcanza (para el ${DIAS[dow]} se piden ${min} h).`};
}
function vAusPedir(){
  const F={tipo:'franco', fecha:'', hora:'', motivo:'', institucion:'', materia:'', diaAnterior:false};
  $('#view').innerHTML = cabecera('Pedir con anticipación','72 h para viernes y sábado, 48 h para jueves','ausencias') + `
    <div class="frm">
      <span class="fl">Qué necesitás</span>
      <div class="seg" id="tipos">${Object.entries(AUS_TIPOS).map(([k,t])=>`<button type="button" data-t="${k}" class="${k===F.tipo?'on':''}"><b>${t.nm}</b><small>${t.ds}</small></button>`).join('')}</div>
      <label for="fFecha" id="lFecha">Fecha</label>
      <input type="date" id="fFecha" min="${hoyISO()}">
      <div id="bHora" hidden class="frm"><label for="fHora" id="lHora">Hora</label><input type="time" id="fHora"></div>
      <div id="bExa" hidden class="frm">
        <label for="fInst">Institución</label><input type="text" id="fInst" placeholder="Ej.: UNSa, UCASAL, un terciario">
        <label for="fMat">Carrera y materia</label><input type="text" id="fMat" placeholder="Ej.: Abogacía, Derecho Civil I">
        <label class="chk"><input type="checkbox" id="fAnt">Pido también el día anterior al examen</label>
        <div class="nota">La ley te da hasta 2 días corridos por examen y 10 días por año. Después de rendir, subí la constancia desde «Mis pedidos».</div>
      </div>
      <div id="bMot" class="frm"><label for="fMot">Motivo</label><textarea id="fMot" placeholder="Contá brevemente por qué lo necesitás"></textarea></div>
      <div id="chk" class="msg"></div>
      <button class="btnz" id="enviar" type="button" disabled>Enviar pedido</button>
    </div>`;
  const pintar=()=>{
    document.querySelectorAll('#tipos button').forEach(b=>b.classList.toggle('on', b.dataset.t===F.tipo));
    const t=AUS_TIPOS[F.tipo];
    $('#bHora').hidden=!t.hora; if(t.hora) $('#lHora').textContent=t.hora;
    $('#bExa').hidden=F.tipo!=='examen'; $('#bMot').hidden=F.tipo==='examen';
    $('#lFecha').textContent = F.tipo==='examen' ? 'Fecha del examen' : 'Fecha';
    const r=ausCheck(F); const m=$('#chk');
    m.textContent=r.msg; m.className='msg'+(r.msg?(r.err?' err':' ok'):'');
    $('#enviar').disabled=!r.ok;
  };
  $('#tipos').onclick=e=>{ const b=e.target.closest('button'); if(b){ F.tipo=b.dataset.t; pintar(); } };
  const bind=(id,k,prop)=>{ const el=$(id); el.addEventListener('input',()=>{ F[k]=prop==='checked'?el.checked:el.value; pintar(); }); el.addEventListener('change',()=>{ F[k]=prop==='checked'?el.checked:el.value; pintar(); }); };
  bind('#fFecha','fecha'); bind('#fHora','hora'); bind('#fInst','institucion'); bind('#fMat','materia'); bind('#fAnt','diaAnterior','checked'); bind('#fMot','motivo');
  $('#enviar').onclick=async ()=>{
    const b=$('#enviar'); b.disabled=true; b.textContent='ENVIANDO…';
    try{
      const j=await apiAus('aus_crear', F);
      if(j&&j.ok){ toast('Pedido enviado. Te avisamos acá cuando lo revise Fernando.'); location.hash='ausencias'; return; }
      const m=$('#chk'); m.textContent=(j&&j.error)||'No se pudo enviar.'; m.className='msg err';
    }catch(e){ if(e.message!=='sesion'){ const m=$('#chk'); m.textContent='No se pudo conectar. Probá de nuevo.'; m.className='msg err'; } }
    b.disabled=false; b.textContent='Enviar pedido';
  };
  pintar();
}

/* --- aviso de falta --- */
function vAusAvisar(){
  const hoy=hoyISO();
  const F={fecha:hoy, motivo:'', detalle:''}; let archivo=null;
  $('#view').innerHTML = cabecera('Avisar una falta','Para imprevistos. Avisá apenas sepas, antes del turno','ausencias') + `
    <div class="frm">
      <label for="aFecha">Qué día no venís</label>
      <input type="date" id="aFecha" value="${hoy}" min="${sumDias(hoy,-1)}" max="${sumDias(hoy,3)}">
      <span class="fl">Motivo</span>
      <div class="seg" id="motivos">${Object.entries(AUS_MOTIVOS).map(([k,t])=>`<button type="button" data-m="${k}"><b>${t}</b></button>`).join('')}</div>
      <div class="nota" id="nEnf" hidden>Por ley, el aviso por enfermedad se da en la primera jornada. Si fuiste al médico, subí el certificado; si todavía no lo tenés, podés subirlo después desde «Mis pedidos».</div>
      <label for="aDet">Contanos qué pasó</label>
      <textarea id="aDet" placeholder="Unas líneas alcanzan"></textarea>
      <span class="fl">Certificado o comprobante (opcional)</span>
      <label class="file" id="aFileL">${I.fichas}<span id="aFileT">Sacá una foto o elegí un PDF</span><input type="file" id="aFile" accept="image/*,application/pdf"></label>
      <div id="aMsg" class="msg"></div>
      <button class="btnz" id="aEnviar" type="button" disabled>Enviar aviso</button>
    </div>`;
  $('#aFileL').querySelector('svg').setAttribute('width','22');
  const pintar=()=>{
    document.querySelectorAll('#motivos button').forEach(b=>b.classList.toggle('on', b.dataset.m===F.motivo));
    $('#nEnf').hidden = F.motivo!=='enfermedad';
    $('#aEnviar').disabled = !(F.fecha && F.motivo && F.detalle.trim().length>=5);
  };
  $('#motivos').onclick=e=>{ const b=e.target.closest('button'); if(b){ F.motivo=b.dataset.m; pintar(); } };
  $('#aFecha').addEventListener('change',e=>{ F.fecha=e.target.value; pintar(); });
  $('#aDet').addEventListener('input',e=>{ F.detalle=e.target.value; pintar(); });
  $('#aFile').addEventListener('change',async e=>{
    const f=e.target.files[0]; const m=$('#aMsg'); m.textContent=''; m.className='msg';
    try{ archivo=await leerArchivo(f); $('#aFileT').textContent=f? f.name : 'Sacá una foto o elegí un PDF'; }
    catch(err){ archivo=null; e.target.value=''; m.textContent=err.message; m.className='msg err'; }
  });
  $('#aEnviar').onclick=async ()=>{
    const b=$('#aEnviar'); b.disabled=true; b.textContent=archivo?'SUBIENDO…':'ENVIANDO…';
    try{
      const j=await apiAus('aus_avisar', Object.assign({}, F, {archivo}));
      if(j&&j.ok){ toast(j.aviso||'Aviso enviado. Le llega a Fernando ahora.'); location.hash='ausencias'; return; }
      const m=$('#aMsg'); m.textContent=(j&&j.error)||'No se pudo enviar.'; m.className='msg err';
    }catch(e){ if(e.message!=='sesion'){ const m=$('#aMsg'); m.textContent='No se pudo conectar. Probá de nuevo.'; m.className='msg err'; } }
    b.disabled=false; b.textContent='Enviar aviso';
  };
  pintar();
}

/* --- panel de Fernando --- */
function vAusPanel(){
  if(!esAdmin()){ location.hash='ausencias'; return; }
  $('#view').innerHTML = cabecera('Panel de ausencias','Solo lo ves vos','ausencias') + `<div id="pan"><span class="mut">Cargando…</span></div>`;
  pintarPanel();
}
async function pintarPanel(){
  let j; try{ j=await apiAus('aus_panel'); }catch(e){ return; }
  const box=$('#pan'); if(!box) return;
  if(!j||!j.ok){ box.innerHTML=`<div class="msg err">${esc((j&&j.error)||'No se pudo cargar el panel.')}</div>`; return; }
  const g={}; j.proximas.forEach(s=>{ (g[s.fecha]=g[s.fecha]||[]).push(s); });
  const prox = Object.keys(g).sort().map(f=>{ const n=g[f].filter(s=>s.tipo!=='tarde'&&s.tipo!=='temprano').length; return `<div class="dia"><div class="dh">${esc(fechaLarga(f))}<span class="${n>=j.cupo?'full':''}">${n} de ${j.cupo} ausentes</span></div>${g[f].map(s=>`<div class="dl">${esc(s.nombre)} <span class="mut">${esc(etiquetaTipo(s))}${s.estado==='pendiente'?', sin aprobar':''}</span></div>`).join('')}</div>`; }).join('');
  box.innerHTML = `
    <h2>Para revisar</h2>${j.pendientes.length ? j.pendientes.map(s=>solItem(s,true)).join('') : '<div class="pend">No hay pedidos para revisar.</div>'}
    <h2>Próximas 4 semanas</h2>${prox || '<div class="pend">Nadie pidió días ni avisó faltas.</div>'}
    <h2>Faltan comprobantes</h2>${j.faltantes.length ? j.faltantes.map(s=>solItem(s,true)).join('') : '<div class="pend">Están todos al día.</div>'}
    <h2>Avisos de los últimos 30 días</h2>${j.avisos.length ? j.avisos.map(s=>solItem(s,true)).join('') : '<div class="pend">Sin avisos de falta.</div>'}
    <h2>Fechas bloqueadas</h2>
    <p class="mut" style="margin:-4px 0 10px">Esas noches no se aceptan días libres ni cambios de horario. Los exámenes y los avisos de falta sí entran.</p>
    ${j.bloqueos.map(b=>`<div class="dia"><div class="dh">${esc(fechaLarga(b.fecha))}<span>${esc(b.motivo)}</span><button class="xbtn" data-act="bloq-del" data-f="${esc(b.fecha)}" aria-label="Quitar">×</button></div></div>`).join('')}
    <div class="frm"><div class="row"><input type="date" id="bF" min="${hoyISO()}"><input type="text" id="bM" placeholder="Motivo"><button type="button" data-act="bloq-add">Bloquear</button></div></div>
    <h2>Días por examen en ${new Date().getFullYear()}</h2>
    ${j.examenes.length ? `<div class="dia">${j.examenes.map(x=>`<div class="dl">${esc(x.nombre)} <span class="mut">${x.dias} de ${j.tope}</span></div>`).join('')}</div>` : '<div class="pend">Nadie pidió días por examen este año.</div>'}`;
}

/* --- acciones (delegadas) --- */
document.addEventListener('click', async e=>{
  const b=e.target.closest('[data-act]'); if(!b || !SES) return;
  const act=b.dataset.act, id=b.dataset.id;
  try{
    if(act==='cancelar'){
      if(!confirm('¿Cancelás este pedido?')) return;
      b.disabled=true; const j=await apiAus('aus_cancelar',{id}); toast(j&&j.ok?'Pedido cancelado.':(j&&j.error)||'No se pudo cancelar.'); vAus(); cargarAusResumen();
    } else if(act==='aprobar' || act==='rechazar'){
      let comentario='';
      if(act==='rechazar'){ comentario=prompt('¿Por qué lo rechazás? (lo ve la persona)'); if(comentario===null) return; }
      b.disabled=true; const j=await apiAus('aus_resolver',{id, estado: act==='aprobar'?'aprobada':'rechazada', comentario});
      toast(j&&j.ok?(act==='aprobar'?'Pedido aprobado.':'Pedido rechazado.'):(j&&j.error)||'No se pudo guardar.'); pintarPanel(); cargarAusResumen();
    } else if(act==='bloq-add'){
      const fecha=$('#bF').value, motivo=$('#bM').value.trim();
      if(!fecha||!motivo){ toast('Poné fecha y motivo.'); return; }
      b.disabled=true; const j=await apiAus('aus_bloqueo_add',{fecha,motivo}); toast(j&&j.ok?'Fecha bloqueada.':(j&&j.error)||'No se pudo bloquear.'); pintarPanel();
    } else if(act==='bloq-del'){
      const j=await apiAus('aus_bloqueo_del',{fecha:b.dataset.f}); toast(j&&j.ok?'Fecha desbloqueada.':(j&&j.error)||'No se pudo quitar.'); pintarPanel();
    }
  }catch(err){ if(err.message!=='sesion') toast('No se pudo conectar. Probá de nuevo.'); b.disabled=false; }
});
document.addEventListener('change', async e=>{
  const inp=e.target.closest('input[data-subir]'); if(!inp || !SES) return;
  const lab=inp.parentElement, txt=lab.firstChild.textContent;
  try{
    const archivo=await leerArchivo(inp.files[0]); if(!archivo) return;
    lab.firstChild.textContent='Subiendo…';
    const j=await apiAus('aus_adjuntar',{id:inp.dataset.id, campo:inp.dataset.subir, archivo});
    if(j&&j.ok){ toast('Listo, quedó cargado.'); vAus(); } else { toast((j&&j.error)||'No se pudo subir.'); lab.firstChild.textContent=txt; }
  }catch(err){ if(err.message!=='sesion') toast(err.message||'No se pudo subir.'); lab.firstChild.textContent=txt; inp.value=''; }
});

/* ===================== ROUTER / SESIÓN ===================== */
function route(){
  if(!SES) return;
  const [v,a,b]=(location.hash.slice(1)||'').split('/');
  if(v==='manual') vManual(a);
  else if(v==='protocolos') vProtocolos();
  else if(v==='protocolo') vProtocolo(a,b);
  else if(v==='reglamento') vReglamento();
  else if(v==='ausencias'){ if(a==='pedir') vAusPedir(); else if(a==='avisar') vAusAvisar(); else if(a==='panel') vAusPanel(); else vAus(); }
  else vHome();
}
window.addEventListener('hashchange',()=>{ route(); window.scrollTo(0,0); });

function pintarQuien(){ const u=SES.usuario||{}; $('#quien').textContent=((u.nombre||'')+' '+(u.apellido||'')).trim()+(u.rol?' · '+u.rol:''); }
function entrar(){ $('#login').style.display='none'; $('#app').style.display='block'; pintarQuien(); route(); cargarRegEstado(); cargarAusResumen(); }
function mostrarLogin(msg){ $('#app').style.display='none'; $('#login').style.display='flex'; $('#lErr').textContent=msg||''; setTimeout(()=>$('#lDni').focus(),50); }
function salir(){ SES=null; sesSet(null); REG={estado:'cargando'}; AUSR=null; mostrarLogin(''); }

$('#lForm').addEventListener('submit', async ev=>{
  ev.preventDefault();
  const dni=$('#lDni').value.replace(/\D/g,''), pass=$('#lPass').value, err=$('#lErr'), btn=$('#lBtn');
  if(!dni||!pass){ err.textContent='Ingresá DNI y clave'; return; }
  btn.disabled=true; err.textContent='Verificando…';
  try{
    const j=await post(ACCESOS_URL,{action:'login',dni,pass});
    if(!j||!j.ok){ err.textContent=(j&&j.error)||'No se pudo ingresar'; return; }
    SES={token:j.token,usuario:j.usuario}; sesSet(SES);
    $('#lPass').value=''; err.textContent=''; entrar();
  }catch(e){ err.textContent='No se pudo conectar'; }
  finally{ btn.disabled=false; }
});
$('#salir').addEventListener('click', salir);

(async()=>{
  const s=sesGet();
  if(!(s && s.token && tokenVigente(s.token))){ mostrarLogin(''); return; }
  SES=s; entrar();
  try{
    const j=await post(ACCESOS_URL,{action:'sesion',token:s.token});
    if(j && j.ok && j.usuario){ SES.usuario=j.usuario; sesSet(SES); pintarQuien(); route(); }
    else if(j && j.error==='sesion'){ salir(); $('#lErr').textContent='Tu sesión venció. Volvé a ingresar.'; }
  }catch(e){}
})();
</script>
