<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Zeppelin · Fichas técnicas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>
/* ===== CONFIGURAR ANTES DE SUBIR ===== */
const ENDPOINT    = 'https://script.google.com/macros/s/AKfycby2xWyn_9xAgSV7xsPaUYL7_NNj9yK60PL_DG3sWtuvCjiF8bTEewdE69qBnPSU9_yOHQ/exec';
const READ_TOKEN  = 'zeppelin';   // el mismo READ_TOKEN del backend
</script>
<style>
:root{--bg:#0A0A0A;--surface:#151515;--surface2:#1d1d1d;--line:#2a2a2a;--orange:#FF5A00;--text:#f4f4f4;--muted:#8c8c8c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Oswald',system-ui,sans-serif;font-weight:300}
button{font-family:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#0d0d0d,#0a0a0a);border-bottom:1px solid var(--line);padding:12px 16px}
.brand{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:1px;line-height:.9}
.brand b{color:var(--orange)} .brand span{display:block;font-family:'Oswald';font-weight:300;font-size:10px;letter-spacing:3px;color:var(--muted);margin-top:2px}
.controls{display:flex;gap:8px;margin-top:12px}
.search{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:9px;font-size:16px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:var(--surface);color:var(--muted);border:none;padding:0 13px;font-size:12px;letter-spacing:1px;text-transform:uppercase}
.seg button.on{background:var(--orange);color:#0a0a0a}
main{max-width:900px;margin:0 auto;padding:12px 14px}
.grp{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--orange);font-weight:600;margin:14px 4px 8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:8px;cursor:pointer}
.item:active{background:var(--surface2)}
.item .nom{font-size:17px}
.item .sub{font-size:12px;color:var(--muted);margin-top:2px}
.item .arw{color:var(--orange);font-size:20px}
.status{font-size:12px;color:var(--muted);padding:6px 4px}
.empty{color:var(--muted);text-align:center;padding:40px 20px}

/* overlay ficha */
.ov{position:fixed;inset:0;background:#2a2a2a;z-index:60;overflow:auto;display:none}
.ov.show{display:block}
.ov-bar{position:sticky;top:0;display:flex;gap:10px;align-items:center;background:#0d0d0d;border-bottom:1px solid var(--line);padding:10px 14px;z-index:2}
.ov-bar button{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-size:14px}
.ov-bar .pr{background:var(--orange);color:#0a0a0a;border:none;margin-left:auto}

.ftec{background:#fff;color:#1a1a1a;max-width:820px;margin:16px auto;border-radius:6px;border-top:5px solid #FF5A00;box-shadow:0 4px 20px rgba(0,0,0,.4);padding:26px 28px}
.ftec-tag{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#FF5A00;font-weight:600}
.ftec-name{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:1px;line-height:.95;color:#111;margin:2px 0}
.ftec-desc{font-size:13px;color:#666;margin-bottom:12px;font-style:italic}
.ftec-rinde{display:flex;gap:30px;border-top:1px solid #e3e3e3;border-bottom:1px solid #e3e3e3;padding:10px 0;margin-bottom:6px}
.ftec-rinde .lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#999;display:block;margin-bottom:2px}
.ftec-rinde .val{font-size:16px;color:#111}
.ftec-h{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#FF5A00;font-weight:600;border-bottom:2px solid #111;padding-bottom:4px;margin:18px 0 8px}
.ftec-ing{width:100%;border-collapse:collapse}
.ftec-ing td{padding:7px 0;border-bottom:1px solid #eee;font-size:15px;color:#222}
.ftec-ing td.q{text-align:right;white-space:nowrap;color:#111;font-weight:500}
.ftec-steps{margin:0;padding-left:22px;font-size:14px;line-height:1.65;color:#222}
.ftec-steps li{margin-bottom:5px}
.ftec-foot{display:flex;justify-content:space-between;border-top:1px solid #e3e3e3;margin-top:22px;padding-top:8px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#999}
.ftec-cris{margin:2px 0 6px}
.ftec-cris .lbl2{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#999;display:block;margin-bottom:5px}
.ftec-imgs{display:flex;gap:14px;flex-wrap:wrap}
.ftec-imgs figure{margin:0;text-align:center;width:100px}
.ftec-imgs img{width:100px;height:100px;object-fit:contain;border:1px solid #e3e3e3;border-radius:6px;background:#fafafa}
.ftec-imgs figcaption{font-size:11px;color:#666;margin-top:3px;line-height:1.2}

@media print{
  header,main,.ov-bar{display:none!important}
  .ov{position:static;background:#fff;overflow:visible;display:block!important}
  .ftec{box-shadow:none;border:1px solid #ddd;border-top:5px solid #FF5A00;margin:0;max-width:none}
  body{background:#fff!important}
}
</style>
</head>
<body>
<header>
  <div class="brand"><b>ZEPPELIN</b> FICHAS<span>Recetario técnico · barra & cocina</span></div>
  <div class="controls">
    <input class="search" id="q" placeholder="Buscar trago o plato…" oninput="ui.q=this.value;renderList()">
    <div class="seg" id="seg">
      <button data-a="" class="on" onclick="setArea('')">Todo</button>
      <button data-a="barra" onclick="setArea('barra')">Barra</button>
      <button data-a="cocina" onclick="setArea('cocina')">Cocina</button>
    </div>
  </div>
</header>
<main id="main"><div class="status" id="status">Cargando fichas…</div></main>

<div class="ov" id="ov"><div class="ov-bar"><button onclick="closeFicha()">← Volver</button><button class="pr" onclick="window.print()">🖨️ Imprimir</button></div><div id="ovc"></div></div>

<script>
let data={products:[],recipes:[],ingredients:[]};
let ui={q:'',area:''};
const ingById=id=>data.ingredients.find(i=>i.id===id);
const recipesOf=pid=>data.recipes.filter(r=>r.productId===pid);
const esc=s=>(''+(s==null?'':s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

async function load(){
  try{
    const r=await fetch(ENDPOINT+'?token='+encodeURIComponent(READ_TOKEN)+'&t='+Date.now());
    const d=await r.json(); if(d.error) throw new Error(d.error);
    data={products:d.products||[],recipes:d.recipes||[],ingredients:d.ingredients||[]};
    renderList();
  }catch(e){ document.getElementById('main').innerHTML='<div class="empty">No se pudieron cargar las fichas. Revisá la conexión.</div>'; }
}
function setArea(a){ ui.area=a; [...document.querySelectorAll('#seg button')].forEach(b=>b.classList.toggle('on',b.dataset.a===a)); renderList(); }

function renderList(){
  const q=ui.q.toLowerCase();
  const items=data.products.filter(p=>p.fichaOn && (!ui.area||p.area===ui.area) && p.name.toLowerCase().includes(q))
    .sort((a,b)=>a.area.localeCompare(b.area)||a.name.localeCompare(b.name));
  const m=document.getElementById('main');
  if(!items.length){ m.innerHTML='<div class="empty">No hay fichas para mostrar.</div>'; return; }
  let html='',cur='\u0000';
  items.forEach(p=>{
    if(p.area!==cur){ cur=p.area; html+=`<div class="grp">${p.area==='barra'?'Barra':p.area==='cocina'?'Cocina':'Otros'}</div>`; }
    const n=recipesOf(p.id).length;
    html+=`<div class="item" onclick="openFicha('${p.id}')"><div><div class="nom">${esc(p.name)}</div><div class="sub">${n} ingrediente${n!==1?'s':''}${p.rinde?' · '+esc(p.rinde):''}</div></div><div class="arw">›</div></div>`;
  });
  m.innerHTML=html;
}

function ficha(p){
  const lines=recipesOf(p.id);
  const pesoG=lines.filter(r=>{const i=ingById(r.ingredientId);return i&&i.unit==='g';}).reduce((a,r)=>a+(+r.qty||0),0);
  const armado=(p.steps||'').split('\n').map(x=>x.trim()).filter(Boolean);
  const tag=p.area==='barra'?'BARRA':p.area==='cocina'?'COCINA':'PRODUCTO';
  return `<div class="ftec">
    <div class="ftec-tag">ZEPPELIN · FICHA TÉCNICA · ${tag}</div>
    <div class="ftec-name">${esc(p.name)}</div>
    ${p.composition?`<div class="ftec-desc">${esc(p.composition)}</div>`:''}
    <div class="ftec-rinde"><div><span class="lbl">Rinde</span><span class="val">${p.rinde?esc(p.rinde):'—'}</span></div>${pesoG>0?`<div><span class="lbl">Aprox.</span><span class="val">${pesoG} g</span></div>`:''}</div>
    <div class="ftec-h">Ingredientes</div>
    ${(()=>{const imgs=lines.map(r=>ingById(r.ingredientId)).filter(i=>i&&i.img);return imgs.length?`<div class="ftec-cris"><span class="lbl2">Cristalería / presentación</span><div class="ftec-imgs">${imgs.map(i=>`<figure><img src="${i.img}"><figcaption>${esc(i.name)}</figcaption></figure>`).join('')}</div></div>`:'';})()}
    <table class="ftec-ing"><tbody>
    ${lines.length?lines.map(r=>{const ing=ingById(r.ingredientId);return `<tr><td>${ing?esc(ing.name):'?'}</td><td class="q">${r.qty??''} ${r.unit||(ing?ing.unit:'')}</td></tr>`;}).join(''):'<tr><td style="color:#999">Sin ingredientes cargados.</td></tr>'}
    </tbody></table>
    <div class="ftec-h">Armado y elaboración</div>
    ${armado.length?`<ol class="ftec-steps">${armado.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'<div style="color:#999;font-size:13px">Sin pasos cargados.</div>'}
    <div class="ftec-foot"><span>Uso interno · Zeppelin Bar</span><span>${esc(p.name)}</span></div>
  </div>`;
}
function openFicha(id){ const p=data.products.find(x=>x.id===id); if(!p) return; document.getElementById('ovc').innerHTML=ficha(p); const ov=document.getElementById('ov'); ov.classList.add('show'); ov.scrollTop=0; }
function closeFicha(){ document.getElementById('ov').classList.remove('show'); }

load();
</script>
</body>
</html>
